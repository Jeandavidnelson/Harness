[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-harness"
version = "2.2.0"
description = "Deterministic architecture harness and compact context selector"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "graphifyy==0.9.50", "tiktoken==0.14.0", "PyYAML>=6.0"]

[project.scripts]
arch-harness = "architecture_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
architecture_harness = ["runtime/*.mjs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
