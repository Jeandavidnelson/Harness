[workflow]

activation_steps_append = [
  "Before planning significant implementation, identify the relevant Graphify node and run `arch-harness agent context --focus <node> --format json`; give that compact output to the implementation step.",
]

persistent_facts = [
  "At each meaningful implementation checkpoint, run `arch-harness graph refresh --format json` then `arch-harness gate --format json`. Never mark Build complete while a validated error is blocking. Correct code and repeat; never silently edit architecture policy to obtain PASS.",
]

on_complete = "Before reporting Build complete, run `arch-harness graph refresh --format json` and `arch-harness gate --format json`. If exit code is 1, return to implementation with the compact violations until PASS. If exit code is 2, run `arch-harness doctor` and report the technical failure."
