roles:
  Controller:
    match:
      suffix: Controller
  Service:
    match:
      suffix: Service
  Repository:
    match:
      suffix: Repository
  ExternalClient:
    match:
      suffix: Client
  Domain:
    match:
      suffix: Domain
  Infrastructure:
    match:
      suffix: Infrastructure

rules:
  - id: controller-no-repository
    type: forbidden_edge
    source: Controller
    target: Repository
  - id: service-must-repository
    type: required_path
    source: Service
    target: Repository
  - id: domain-no-infrastructure
    type: forbidden_path
    source: Domain
    target: Infrastructure
  - id: controller-must-service
    type: required_edge
    source: Controller
    target: Service
